services:
  - type: web
    name: turn2law-docengine
    env: docker
    dockerfilePath: documentGeneration-master/docgen/Dockerfile
    dockerContext: documentGeneration-master/docgen
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://turn2law-tan.vercel.app,http://localhost:3000
      - key: T2L_COMPANY_NAME
        value: EFFIVIA TURN2LAW LEGAL PRIVATE LIMITED
      - key: T2L_SIGNATORY_NAME
        value: Yash Phoghat
      - key: T2L_DESIGNATION
        value: Founder & CEO
      - key: T2L_COMPANY_EMAIL
        value: turntwolaw@gmail.com
      - key: T2L_COMPANY_WEBSITE
        value: www.turn2law.com
